{% extends "base.html" %}

{% block title %}Chat{% endblock %}

{% block content %}
<div class="chat-container">
    <div class="session-list">
        <h2>Sessions</h2>
        <button id="new-chat-button">New Chat</button>
        <ul id="sessions" style="list-style-type: none; padding: 0;">
            <!-- Session items will be populated by JS -->
        </ul>
    </div>
    <div class="chat-window">
        <div id="chat-history">
            <!-- Chat messages will appear here -->
        </div>
        <div id="new-chat-form" style="display: none;">
            <h3>Start a New Chat</h3>
            <textarea id="json-input" placeholder="Enter JSON input..."></textarea>
            <button id="send-new-chat">Start Chat</button>
        </div>
        <div id="chat-input" style="display: none;">
            <textarea id="user-message-existing" placeholder="Type your message..."></textarea>
            <button id="send-message-button">Send</button>
        </div>
    </div>
</div>

<!-- The Modal -->
<div id="debug-modal" class="modal">
  <!-- Modal content -->
  <div class="modal-content">
    <span class="close">&times;</span>
    <pre id="debug-content"></pre>
  </div>
</div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/firebase-auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
